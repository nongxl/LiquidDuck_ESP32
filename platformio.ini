[platformio]
src_dir = src

[env:m5stack-sticks3]
platform = espressif32
board    = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=5
lib_deps =
    m5stack/M5GFX
    m5stack/M5Unified
    m5stack/M5Cardputer

